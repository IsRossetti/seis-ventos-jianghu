<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Sala - Seis Ventos de Jianghu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Jianghu RPG</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bg-secondary">
                    <div class="card-header">
                        <h4>Criar Nova Sala</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/rooms/create}" method="post" th:object="${room}">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Nome da Sala:</label>
                                <input type="text" class="form-control" 
                                       th:field="*{name}" 
                                       th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'">
                                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                                    <span th:errors="*{name}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Descricao:</label>
                                <textarea class="form-control" rows="3"
                                          th:field="*{description}" 
                                          th:class="${#fields.hasErrors('description')} ? 'form-control is-invalid' : 'form-control'"
                                          placeholder="Descreva sua campanha..."></textarea>
                                <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback">
                                    <span th:errors="*{description}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="maxPlayers" class="form-label">Maximo de Jogadores:</label>
                                <select class="form-select" th:field="*{maxPlayers}">
                                    <option value="2">2 jogadores</option>
                                    <option value="3">3 jogadores</option>
                                    <option value="4">4 jogadores</option>
                                    <option value="5">5 jogadores</option>
                                    <option value="6" selected>6 jogadores</option>
                                    <option value="7">7 jogadores</option>
                                    <option value="8">8 jogadores</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha (opcional):</label>
                                <input type="password" class="form-control" 
                                       th:field="*{password}"
                                       placeholder="Deixe vazio para sala publica">
                                <small class="form-text text-muted">
                                    Salas com senha sao automaticamente privadas
                                </small>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/rooms" class="btn btn-outline-light me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Criar Sala</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
