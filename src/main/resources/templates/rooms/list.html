<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salas de Jogo - Seis Ventos de Jianghu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Jianghu RPG</a>
            <div class="navbar-nav ms-auto">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- mensagens -->
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Salas de Jogo</h2>
                    <a href="/rooms/create" class="btn btn-primary">Criar Nova Sala</a>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- minhas salas -->
            <div class="col-md-6">
                <div class="card bg-secondary mb-4">
                    <div class="card-header">
                        <h5>Minhas Salas</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(userRooms)}" class="text-muted">
                            Voce nao esta em nenhuma sala
                        </div>
                        <div th:each="participation : ${userRooms}" class="border-bottom pb-2 mb-2">
                            <h6 th:text="${participation.room.name}"></h6>
                            <small class="text-muted">
                                <span th:if="${participation.isGameMaster}" class="badge bg-warning text-dark">GM</span>
                                <span th:text="${participation.room.currentPlayerCount} + '/' + ${participation.room.maxPlayers} + ' jogadores'"></span>
                            </small>
                            <div class="mt-1">
                                <a th:href="@{/rooms/{id}(id=${participation.room.id})}" class="btn btn-sm btn-outline-light">Entrar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- salas publicas -->
            <div class="col-md-6">
                <div class="card bg-secondary mb-4">
                    <div class="card-header">
                        <h5>Salas Publicas</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(publicRooms)}" class="text-muted">
                            Nenhuma sala publica disponivel
                        </div>
                        <div th:each="room : ${publicRooms}" class="border-bottom pb-2 mb-2">
                            <h6 th:text="${room.name}"></h6>
                            <p class="mb-1" th:text="${room.description}"></p>
                            <small class="text-muted">
                                Por: <span th:text="${room.creator.username}"></span> |
                                <span th:text="${room.currentPlayerCount} + '/' + ${room.maxPlayers} + ' jogadores'"></span>
                                <span th:if="${room.hasPassword()}" class="badge bg-warning text-dark ms-1">🔒</span>
                            </small>
                            <div class="mt-1">
                                <form th:action="@{/rooms/{id}/join(id=${room.id})}" method="post" class="d-inline">
                                    <input th:if="${room.hasPassword()}" type="password" name="password" placeholder="Senha" class="form-control form-control-sm d-inline-block me-1" style="width: 100px;">
                                    <button type="submit" class="btn btn-sm btn-success" th:disabled="${room.isFull()}">
                                        <span th:if="${room.isFull()}">Lotada</span>
                                        <span th:unless="${room.isFull()}">Entrar</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
